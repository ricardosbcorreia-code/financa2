<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fundo do Ícone -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="8" />

  <!-- Emblema de Destaque -->
  <circle cx="256" cy="256" r="160" fill="url(#accentGrad)" opacity="0.15" filter="url(#glow)" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#accentGrad)" stroke-width="12" />

  <!-- Texto / Símbolo F2 -->
  <text x="256" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="160" font-weight="900" fill="url(#accentGrad)" text-anchor="middle" letter-spacing="-6">F2</text>
  
  <!-- Dois pontos simbolizando Ricardo e Natália -->
  <circle cx="216" cy="370" r="14" fill="#38bdf8" />
  <circle cx="296" cy="370" r="14" fill="#f43f5e" />
</svg>
